    * {

      padding: 0;

    }

    body {
      background: #f8f6f2;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #2c1e16;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #7f6b5c;
      margin-left: 0.5rem;
    }

    .filter-section {
      background: white;
      border-radius: 20px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e5ded7;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem 2rem;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem 0.6rem;
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #7f6b5c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 0.2rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid #e5ded7;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #4f3e32;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .filter-btn:hover {
      background: #f0ebe6;
      border-color: #ccc2b8;
    }

    .filter-btn.active {
      background: #2c1e16;
      color: white;
      border-color: #2c1e16;
    }

    .filter-btn.active-gender {
      background: #2c1e16;
      color: white;
      border-color: #2c1e16;
    }

    .filter-btn.active-scent {
      background: #8b6b4d;
      color: white;
      border-color: #8b6b4d;
    }

    .filter-btn.active-place {
      background: #3d6b7a;
      color: white;
      border-color: #3d6b7a;
    }

    .filter-btn.active-activity {
      background: #6b7a4d;
      color: white;
      border-color: #6b7a4d;
    }

    .filter-divider {
      width: 1px;
      height: 28px;
      background: #e5ded7;
    }

    .filter-stats {
      font-size: 0.8rem;
      color: #7f6b5c;
      background: #f5f1ed;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-weight: 500;
      margin-left: auto;
      white-space: nowrap;
    }

    .reset-btn {
      background: transparent;
      border: 1px dashed #ccc2b8;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.7rem;
      color: #7f6b5c;
      cursor: pointer;
      transition: 0.2s;
    }

    .reset-btn:hover {
      background: #f5f1ed;
      border-color: #b3a092;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 1.25rem 1.25rem 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      border: 1px solid #ede8e2;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      border-color: #d6ccc3;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .card-number {
      font-size: 0.7rem;
      font-weight: 600;
      color: #b3a092;
      background: #f2ede8;
      padding: 0.15rem 0.6rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1f150f;
      word-break: break-word;
    }

    .card-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 40px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background: #f0ebe6;
      color: #4f3e32;
      margin-right: 0.3rem;
    }

    .badge-feminim { background: #fce9e6; color: #b13e3a; }
    .badge-masculine { background: #e3ecf5; color: #1e4c73; }
    .badge-unisex { background: #e6f0e9; color: #2b6e4f; }

    .badge-scent { background: #f5ede4; color: #8b6b4d; }
    .badge-place { background: #e4edf0; color: #3d6b7a; }
    .badge-activity { background: #edf0e4; color: #6b7a4d; }

    .card-desc {
      margin: 0.7rem 0 0.5rem;
      font-size: 0.9rem;
      color: #3b2e25;
      line-height: 1.4;
    }

    .card-notes {
      font-size: 0.8rem;
      color: #6f5d4e;
      background: #f8f4f0;
      padding: 0.5rem 0.7rem;
      border-radius: 14px;
      margin: 0.3rem 0 0.5rem;
      border-left: 3px solid #d6ccc3;
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
      margin-top: 0.3rem;
      font-size: 0.7rem;
      color: #7f6b5c;
      border-top: 1px solid #ede8e2;
      padding-top: 0.7rem;
      margin-top: auto;
    }

    .card-meta span {
      background: #f5f1ed;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: #9b8a7b;
      background: #faf8f6;
      border-radius: 40px;
      border: 1px dashed #ddd2c8;
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      header { flex-direction: column; align-items: stretch; }
      .filter-section { flex-direction: column; align-items: stretch; gap: 0.8rem; padding: 0.8rem 1rem; }
      .filter-group { flex-wrap: wrap; }
      .filter-divider { display: none; }
      .filter-stats { margin-left: 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  // ========== STATE FILTER ==========
  const filters = {
    gender: 'all',
    scent: 'all',
    place: 'all',
    activity: 'all'
  };

  const grid = document.getElementById('cardGrid');
  const filterStats = document.getElementById('filterStats');

  // ========== RENDER ==========
  function render() {
    const filtered = products.filter(p => {
      if (filters.gender !== 'all' && p.gender !== filters.gender) return false;
      if (filters.scent !== 'all' && p.scent !== filters.scent) return false;
      if (filters.place !== 'all' && p.place !== filters.place) return false;
      if (filters.activity !== 'all' && p.activity !== filters.activity) return false;
      return true;
    });

    filterStats.textContent = `${filtered.length} varian`;

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">☁️ Tidak ada varian untuk filter yang dipilih</div>`;
      return;
    }

    grid.innerHTML = filtered.map(p => {
      const genderClass = p.gender === 'feminim' ? 'badge-feminim' : 
                          p.gender === 'masculine' ? 'badge-masculine' : 'badge-unisex';
      const scentLabel = p.scent === 'manis' ? '🍯 Manis' : '🌊 Segar';
      const placeLabel = p.place === 'indoor' ? '🏠 Indoor' : '🌳 Outdoor';
      const activityLabel = p.activity === 'olahraga' ? '🏋️ Olahraga' : '❄️ AC';
      return `
        <div class="card">
          <div class="card-header">
            <span class="card-title">${p.name}</span>
            <span class="card-number">#${p.no}</span>
          </div>
          <div>
            <span class="card-badge ${genderClass}">${p.gender}</span>
            <span class="card-badge badge-scent">${scentLabel}</span>
            <span class="card-badge badge-place">${placeLabel}</span>
            <span class="card-badge badge-activity">${activityLabel}</span>
          </div>
          <div class="card-desc">${p.desc}</div>
          ${p.notes ? `<div class="card-notes">🍃 ${p.notes}</div>` : ''}
          <div class="card-meta">
            <span>🏷️ ${p.gender}</span>
            <span>📍 ${placeLabel}</span>
            <span>📌 #${p.no}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // ========== EVENT LISTENER FILTER ==========
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const filterType = btn.dataset.filter;
      const value = btn.dataset.value;

      // Update state
      filters[filterType] = value;

      // Update UI active class dalam group yang sama
      const parentGroup = btn.closest('.filter-group');
      parentGroup.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active', 'active-gender', 'active-scent', 'active-place', 'active-activity');
      });

      // Tambah class active sesuai tipe
      if (value === 'all') {
        btn.classList.add('active');
      } else {
        if (filterType === 'gender') btn.classList.add('active-gender');
        else if (filterType === 'scent') btn.classList.add('active-scent');
        else if (filterType === 'place') btn.classList.add('active-place');
        else if (filterType === 'activity') btn.classList.add('active-activity');
      }

      render();
    });
  });

  // ========== RESET ==========
  document.getElementById('resetFilters').addEventListener('click', () => {
    filters.gender = 'all';
    filters.scent = 'all';
    filters.place = 'all';
    filters.activity = 'all';

    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active', 'active-gender', 'active-scent', 'active-place', 'active-activity');
      if (b.dataset.value === 'all') {
        b.classList.add('active');
      }
    });

    render();
  });

  // ========== INIT ==========
  render();
</script>
